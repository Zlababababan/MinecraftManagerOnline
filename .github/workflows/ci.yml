name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest }
          - { name: ubuntu, os: ubuntu-latest }
          - { name: ubuntu-arm, os: ubuntu-24.04-arm }
          - { name: macos, os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      - name: pnpm (version lue dans package.json › packageManager)
        uses: pnpm/action-setup@v4

      - name: Node (version lue dans .node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Installer
        run: pnpm install --frozen-lockfile

      - name: Formatage
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test
