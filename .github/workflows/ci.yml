name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest }
          - { name: ubuntu, os: ubuntu-latest }
          - { name: ubuntu-arm, os: ubuntu-24.04-arm }
          - { name: macos, os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      - name: pnpm (version lue dans package.json › packageManager)
        uses: pnpm/action-setup@v4

      - name: Node (version lue dans .node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Installer
        run: pnpm install --frozen-lockfile

      - name: Formatage
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      # Phase 11 : archive d'installation de la plateforme courante (runtime Node épinglé par sha256),
      # extraction + `launcher.cjs --version` avec le runtime embarqué.
      - name: Archive agent (plateforme courante) + smoke
        shell: bash
        run: |
          platform=$(node -e "console.log(require('os').platform()==='win32'?'win-x64':require('os').platform()+'-'+process.arch)")
          node tools/release/build.mjs --skip-build --platforms "$platform"
          node tools/release/smoke.mjs --host

  release-archives:
    name: archives (4 plateformes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mmo/agent... build
      - name: Build des 4 archives (clé de développement) + smoke
        run: |
          node tools/release/build.mjs --skip-build
          node tools/release/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mmo-agent-archives
          path: release/
          retention-days: 7
