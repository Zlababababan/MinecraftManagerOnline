name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest }
          - { name: ubuntu, os: ubuntu-latest }
          - { name: ubuntu-arm, os: ubuntu-24.04-arm }
          - { name: macos, os: macos-latest }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: pnpm (version lue dans package.json › packageManager)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Node (version lue dans .node-version)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Installer
        run: pnpm install --frozen-lockfile

      - name: Formatage
        run: pnpm format:check

      # Les archives redistribuent du code tiers (runtime Node, shawl, dépendances npm) : la liste
      # des licences est générée, donc elle vieillirait en silence sans ce garde-fou. Un seul OS
      # suffit — c'est l'arbre de dépendances qui est vérifié, pas la plateforme.
      - name: Notices tierces à jour
        if: matrix.name == 'ubuntu'
        run: pnpm release:notices --check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      # Archives de la plateforme courante (runtime Node épinglé par sha256) : agent, puis PANEL.
      # Le panel est construit ET DÉMARRÉ ici, sur chaque PR et sur les 4 OS. C'est le garde-fou
      # qui manquait : ni la CI ni le smoke ne touchaient à l'archive du panel, ce qui a laissé
      # sortir les archives Linux inutilisables des versions 1.0.2, 1.0.3 et deux 1.0.4.
      - name: Archives agent + panel (plateforme courante) et smoke
        shell: bash
        run: |
          platform=$(node -e "console.log(require('os').platform()==='win32'?'win-x64':require('os').platform()+'-'+process.arch)")
          node tools/release/build.mjs --skip-build --platforms "$platform" --panel
          node tools/release/smoke.mjs --host --panel

  release-archives:
    name: archives (4 plateformes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build des 4 archives (clé de développement) + smoke
        run: |
          node tools/release/build.mjs --skip-build --panel
          node tools/release/smoke.mjs --panel

      # L'archive Linux doit tourner sur une glibc ancienne : debian:11 a exactement la glibc 2.31
      # d'Ubuntu 20.04, la distribution sur laquelle le panel a réellement échoué. Le runtime Node
      # embarqué dans l'archive sert à lancer le smoke — la machine hôte n'a besoin de rien.
      - name: Panel linux-x64 démarré sur glibc 2.31 (debian:11)
        run: |
          docker run --rm -v "$PWD:/w" -w /w debian:11 bash -c '
            set -eu
            tar xzf release/*/mmo-panel-*-linux-x64.tar.gz -C /tmp
            ldd --version | head -1
            "$(ls /tmp/mmo-panel/runtime/*/bin/node)" tools/release/smoke.mjs --host --panel
          '

      # install-panel.sh exercé sur la même image nue (sans systemd ni curl : mode --no-service,
      # hors ligne) : pose des fichiers, gabarit d'unit embarqué, doctor, puis mise à jour
      # par-dessus avec des données à l'ancien emplacement (elles doivent être préservées
      # et sauvegardées, et l'ancien code rester en .old).
      - name: install-panel.sh (debian:11, hors ligne, pose + mise à jour)
        run: |
          docker run --rm -v "$PWD:/w" -w /w debian:11 bash -c '
            set -eu
            sh -n apps/panel/install/install-panel.sh
            archive="$(ls release/*/mmo-panel-*-linux-x64.tar.gz)"
            sh apps/panel/install/install-panel.sh --archive "$archive" --no-service
            test -f /opt/mmo-panel/app/install/mmo-panel.service.tmpl
            mkdir -p /var/lib/mmo-panel
            MMO_DATA_DIR=/var/lib/mmo-panel /opt/mmo-panel/mmo-panel.sh doctor
            mkdir -p /opt/mmo-panel/data && echo fake > /opt/mmo-panel/data/mmo.db
            sh apps/panel/install/install-panel.sh --archive "$archive" --no-service --update
            test -f /opt/mmo-panel/data/mmo.db
            ls /opt/mmo-panel/data/backups/panel/mmo-pre-update-*.db
            test -d /opt/mmo-panel.old
          '
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mmo-agent-archives
          path: release/
          retention-days: 7

  # L'image Docker est construite ET DÉMARRÉE sur chaque PR — même garde-fou que pour l'archive
  # du panel : une image qui ne démarre pas ne doit jamais atteindre une release.
  # Neuf specs Playwright existaient, `pnpm e2e` était déclaré, et aucun job ne les lançait : du
  # travail déjà payé jamais encaissé. Elles avaient d'ailleurs rouillé — six attentes portaient sur
  # une interface changée depuis, et un vrai défaut d'accessibilité s'était installé sans bruit.
  # Chromium seul, projets setup + desktop-fr + mobile-fr : la couverture utile en un quart d'heure.
  e2e:
    name: e2e (playwright, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Le stack e2e importe les SOURCES du panel et de l'agent via tsx, mais passe par les dists de
      # @mmo/protocol et @mmo/shared : sans build, les specs échouent sur un import, pas sur l'UI.
      - run: pnpm build
      - name: Navigateur Playwright (chromium seul)
        run: pnpm --filter @mmo/web exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm --filter @mmo/web exec playwright test --project=setup --project=desktop-fr --project=mobile-fr
      # Traces et captures : sans elles, un échec en CI ne se diagnostique qu'en le rejouant à
      # l'aveugle sur sa propre machine.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: docker (image construite et démarrée)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build de l'image
        run: docker build -t mmo-panel-ci .
      - name: Démarrage + /api/health + doctor
        run: |
          set -eu
          docker run -d --name panel -p 127.0.0.1:3000:3000 mmo-panel-ci
          ok=''
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then docker logs panel; exit 1; fi
          cat /tmp/health.json
          # L'avertissement « toutes les interfaces » doit être bruyant, et le CLI accessible.
          docker logs panel 2>&1 | grep -q 'MMO_ALLOW_ANY_INTERFACE'
          docker run --rm mmo-panel-ci doctor || test $? -eq 1
          docker rm -f panel
