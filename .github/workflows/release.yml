# Release signée sur tag `v*` (doc 03 §3) : matrice 4 OS — chaque hôte produit l'archive du PANEL
# de sa plateforme (elle suit l'hôte de build), l'hôte ubuntu publie en plus les archives d'AGENTS
# des 4 plateformes (bundle universel, reproductible : identique sur tous les hôtes), le bundle
# signé et le manifeste. Signature : secret `MMO_SIGNING_KEY_PEM` (contenu PEM de la clé privée du
# mainteneur ; la clé publique correspondante doit être dans apps/agent/src/update/keys.ts, sinon
# le build refuse). Un job final rassemble les artefacts et crée la release GitHub.
name: Release

on:
  push:
    tags: ['v*']

# Le job `build` matérialise la clé privée de signature : il n'a aucune raison de pouvoir écrire
# sur le dépôt. Seul `publish` en a besoin.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Le tag est la seule chose qu'on tape à la main : deux constantes de version, un CHANGELOG et un
  # tag, sans aucun contrôle jusqu'ici. Ce job coûte vingt secondes et évite de publier une archive
  # 1.0.6 sous un tag v1.0.7 — et il refuse aussi une release dont les notes n'ont pas été écrites.
  guard:
    name: version et notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: node tools/release/check-tag.mjs "$GITHUB_REF_NAME"

  build:
    needs: guard
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Le conteneur ubuntu:20.04 des versions 1.0.2 → 1.0.4 n'est plus nécessaire : le panel n'a
    # plus de module natif SQLite (doc 03 §3) et le seul `.node` restant, `@node-rs/argon2`,
    # n'exige que GLIBC_2.14 (x64) / 2.17 (arm64) — mesuré. `build.mjs` vérifie désormais le
    # plancher de glibc de chaque `.node` embarqué et refuse d'archiver au-delà de 2.31.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, panel: win-x64 }
          - { name: ubuntu, os: ubuntu-latest, panel: linux-x64, agents: true }
          - { name: ubuntu-arm, os: ubuntu-24.04-arm, panel: linux-arm64 }
          - { name: macos, os: macos-latest, panel: darwin-arm64 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build signé (panel ${{ matrix.panel }})
        shell: bash
        env:
          PEM: ${{ secrets.MMO_SIGNING_KEY_PEM }}
        run: |
          test -n "$PEM" || { echo "secret MMO_SIGNING_KEY_PEM absent"; exit 1; }
          printf '%s' "$PEM" > "$RUNNER_TEMP/release.pem"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) node tools/release/build.mjs --skip-build --release --panel --key "$RUNNER_TEMP/release.pem"
          rm -f "$RUNNER_TEMP/release.pem"
          node tools/release/smoke.mjs --panel
      - name: Artefact panel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: panel-${{ matrix.panel }}
          # Le manifeste `panel-<hôte>.json` était produit par build.mjs puis perdu ici : sans lui,
          # personne ne peut vérifier l'empreinte de l'archive téléchargée.
          path: |
            release/*/mmo-panel-*
            release/*/panel-*.json
          if-no-files-found: error
      - name: Artefacts agents (hôte ubuntu uniquement — identiques sur tous les hôtes)
        if: matrix.agents == true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agents
          path: |
            release/*/mmo-agent-*
            release/*/agent-*.js
            release/*/manifest.json
          if-no-files-found: error

  # Image Docker officielle multi-arch (amd64 + arm64) vers ghcr.io, avec les archives d'agents
  # de la release embarquées (docker/dist-agent/) : le panel en conteneur sert les one-liners
  # d'installation comme depuis une archive classique. arm64 passe par QEMU : lent mais rare.
  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: agents
          path: agents
      - name: Agents embarqués dans l'image
        run: |
          mkdir -p docker/dist-agent
          cp agents/*/mmo-agent-* agents/*/agent-*.js agents/*/manifest.json docker/dist-agent/
          ls -l docker/dist-agent
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build et push multi-arch
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$image:$version" -t "$image:latest" --push .

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Attestation de provenance : GitHub signe « ces fichiers sortent de ce dépôt, de ce workflow,
      # de ce commit », vérifiable par `gh attestation verify` sans aucune clé à gérer. À ne pas
      # confondre avec la signature Ed25519, qui protège la chaîne de mise à jour de l'AGENT et pas
      # l'archive qu'un humain télécharge.
      id-token: write
      attestations: write
    steps:
      # Checkout : install-panel.sh est publié comme asset de release (l'URL stable
      # releases/latest/download/install-panel.sh est celle du one-liner du guide §1.2).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true
      - name: Notes de release, depuis le CHANGELOG
        run: node tools/release/check-tag.mjs "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/notes.md"
      # Un seul fichier d'empreintes, vérifiable d'une commande (`sha256sum -c`), là où les
      # manifestes obligent à ouvrir un JSON par plateforme et à comparer à l'œil.
      # Écrit HORS de `dist` : le glob de publication est `dist/**/*`, et un fichier listé deux
      # fois ferait échouer le téléversement.
      - name: SHA256SUMS.txt
        run: node tools/release/sha256sums.mjs dist "$RUNNER_TEMP/SHA256SUMS.txt"
      - name: Attestation de provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/**/mmo-panel-*
            dist/**/mmo-agent-*
      - name: Publication GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/**/*
            ${{ runner.temp }}/SHA256SUMS.txt
            apps/panel/install/install-panel.sh
            apps/panel/install/install-panel.ps1
