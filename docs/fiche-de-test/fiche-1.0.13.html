<style>
  :root {

      --ok: #62c28b; --ko: #e86e5e; --skip: #dca648; --opt: #a3aef2;

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  pre .copy-code { position: absolute; top: 6px; right: 6px; font: 11px var(--sans); padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--muted); }

  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }

  .item.s-ok { border-left-color: var(--ok); }
  .item.s-ko { border-left-color: var(--ko); background: var(--ko-bg); }
  .item.s-skip { border-left-color: var(--skip); }

  .item.opt.s-ko { border-left-style: solid; border-left-color: var(--ko); }
  .item.opt.s-skip { border-left-style: solid; border-left-color: var(--skip); }

  .item.current { border-color: var(--accent); border-style: solid; background: var(--cur-bg); box-shadow: 0 0 0 3px var(--accent), 0 6px 18px rgba(0, 0, 0, .18); padding: 14px 14px; margin: 6px 0; }
  .item.current .body > p:first-child { font-size: 16px; }

  .item.current .ctl button { font-size: 14px; padding: 8px 14px; color: var(--text); }

  .ctl .has-note { color: var(--accent); border-color: var(--accent); }

  .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .modal .box { background: var(--surface); border-radius: 8px; padding: 16px; width: min(720px, 100%); display: flex; flex-direction: column; gap: 10px; }
  .modal p { margin: 0; color: var(--muted); font-size: 13px; }
  .modal textarea { width: 100%; height: 50vh; font: 13px var(--mono); background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 8px; }
  [hidden] { display: none !important; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }

    .side a { border: 1px solid var(--border); }
    .item { grid-template-columns: 1fr; }
  }
</style>

<script type="application/json" id="fiche-data">{"cle":"mmo-1.0.13","titre":"Fiche de test — MMO 1.0.13 « pas de détour »","sousTitre":"Version 1.0.13 · 36 étapes (dont 8 optionnelles) · écrite le 2 octobre 2026","langue":"fr","intro":["Cette fiche ne couvre que **ce que la 1.0.13 apporte** : le zip par son chemin, « Actualiser » sur la page Serveurs, les remèdes aux refus de démarrage, la mise à jour de l'agent depuis le tableau de bord, « prêt à rejoindre » et la pastille de port. Le reste de l'application n'y est pas.","Comptez **20 à 30 minutes** sans les étapes *optionnel*. Aucune échéance : la page garde vos coches, vous pouvez arrêter et reprendre. Au moindre écart, même cosmétique (« ça marche mais c'est loin »), mettez KO ou laissez une note avec l'heure."],"regle":"**Vos vrais serveurs ne servent qu'à regarder.** Tout ce qui démarre, modifie un fichier ou supprime se fait sur le serveur `test-1013` créé à l'étape 4.1, et il est retiré à la fin (bloc 7).","environnement":[{"quoi":"Panel","ou":"`http://127.0.0.1:3000` — dossier `E:\\mmo-panel\\mmo-panel-1.0.13`, lancé par l'icône près de l'horloge (sans fenêtre)"},{"quoi":"Agent","ou":"sur cette même machine ; encore en **1.0.11** tant que l'étape 1.3 n'est pas faite"},{"quoi":"Compte","ou":"votre compte administrateur (le zip par chemin est réservé à l'administrateur)"},{"quoi":"Un zip « server files »","ou":"celui d'un modpack, là où il est déjà (Téléchargements, par exemple) : ne le déplacez pas"}],"sections":[{"titre":"0. Avant de commencer","contexte":"Vérifie que c'est bien la 1.0.13 qui tourne : un test fait sur l'ancienne version ne vaut rien.","etapes":[{"id":"0.1","action":"Ouvrir `http://127.0.0.1:3000` dans le navigateur et se connecter avec le compte administrateur.","attendu":"Le **Tableau de bord** s'affiche, avec le bouton **Créer un serveur**."},{"id":"0.2","action":"Regarder le haut du tableau de bord.","attendu":"Un bandeau bleu dit « L'agent de « … » peut passer de 1.0.11 à 1.0.13. » avec le bouton **Mettre à jour l'agent**, et dessous « Les serveurs Minecraft continuent de tourner pendant la mise à jour. ». *S'il n'y a pas de bandeau, l'agent est déjà à jour : mettez « Passé » ici et sur tout le bloc 1.*"}]},{"titre":"1. Agent trop ancien : le refus, puis la mise à jour sur place","contexte":"À faire AVANT de mettre l'agent à jour : on vérifie d'abord que le refus dit quoi faire.","etapes":[{"id":"1.1","action":"Sur le tableau de bord, cliquer **Créer un serveur**, puis choisir **Archive (.zip)**.","attendu":"Le premier champ s'appelle « Chemin du zip sur la machine », avec le bouton **Utiliser ce zip**. La liste « Ou choisissez un zip déjà posé dans un dossier surveillé » est en dessous."},{"id":"1.2","action":"Dans l'Explorateur Windows, clic droit sur votre zip → **Copier en tant que chemin**. Coller dans le champ, puis cliquer **Utiliser ce zip**.","attendu":"Un message rouge dit : « L'agent de cette machine est trop ancien pour cette opération : mettez-le à jour (bandeau du tableau de bord), puis réessayez. ». Fermer l'assistant."},{"id":"1.3","action":"Sur le tableau de bord, cliquer **Mettre à jour l'agent** dans le bandeau bleu.","attendu":"Une notification verte « Mise à jour 1.0.13 envoyée. » apparaît. En moins d'une minute (recharger la page avec F5 au besoin), le bandeau bleu a disparu."},{"id":"1.4","action":"Ouvrir **Réglages**, section **Machine**, et regarder la carte **Agent**.","attendu":"« Version de l'agent » indique 1.0.13 et la mention « à jour »."},{"id":"1.5","action":"Revenir sur **Serveurs** et regarder les cartes des serveurs qui étaient en marche avant la mise à jour (s'il y en avait).","attendu":"Ils sont toujours « en marche » : la mise à jour de l'agent ne les a pas arrêtés.","optionnel":true}]},{"titre":"2. Créer un serveur depuis un zip, par son chemin","contexte":"Le zip reste où il est. Rien n'est installé avant l'étape 2.5, qui est optionnelle.","etapes":[{"id":"2.1","action":"**Créer un serveur** → **Archive (.zip)**. Coller de nouveau le chemin du zip, **avec ses guillemets**, puis cliquer **Utiliser ce zip**.","attendu":"Les guillemets disparaissent du champ. « Lecture de l'archive… » s'affiche quelques secondes, puis : le nom du zip, « N fichiers, X une fois dépliés. » et « Le panel installera *chargeur* *version* pour Minecraft *version* (lu dans …). »"},{"id":"2.2","action":"Remplacer le chemin par un chemin relatif, `Downloads\\pack.zip`, puis appuyer sur **Entrée**.","attendu":"Message rouge : « Donnez le chemin complet d'un fichier .zip sur la machine, par exemple C:\\Users\\vous\\Downloads\\pack.zip. ». L'assistant ne passe pas à l'étape suivante."},{"id":"2.3","action":"Remplacer par un fichier qui n'est pas un zip, `C:\\Windows\\win.ini`, puis **Utiliser ce zip**.","attendu":"Le même message rouge « Donnez le chemin complet d'un fichier .zip… »."},{"id":"2.4","action":"Remplacer par un zip qui n'existe pas, `C:\\nexiste-pas.zip`, puis **Utiliser ce zip**.","attendu":"Message rouge qui commence par « L'archive n'est plus à cet endroit : C:\\nexiste-pas.zip. »."},{"id":"2.5","action":"Recoller le vrai chemin, **Utiliser ce zip**, puis aller au bout de l'assistant avec le nom de dossier `test-1013-pack` et cliquer **Créer le serveur**. *Un gros modpack met plusieurs minutes à se déplier.*","attendu":"La page du serveur `test-1013-pack` s'ouvre ; l'indicateur des tâches (en haut) montre l'installation, puis elle se termine sans erreur. Le zip d'origine est toujours à sa place, intact.","optionnel":true},{"id":"2.6","action":"Sur la page de `test-1013-pack`, cliquer **Démarrer** et attendre (plusieurs minutes pour un gros modpack).","attendu":"« Démarrage depuis … » puis « Prêt : on peut rejoindre le serveur à l'adresse … ». Cliquer ensuite **Arrêter**.","optionnel":true}]},{"titre":"3. Page Serveurs : actualiser et ajouter, sur place","etapes":[{"id":"3.1","action":"Cliquer **Serveurs** dans le menu et regarder le haut de la page.","attendu":"Trois boutons côte à côte : **Créer un serveur**, **Ajouter un dossier serveur**, **Actualiser**."},{"id":"3.2","action":"Laisser la souris sur **Actualiser** sans cliquer.","attendu":"Une infobulle dit : « Cherche dans les dossiers surveillés les serveurs ajoutés ou retirés sur le disque. »"},{"id":"3.3","action":"Cliquer **Actualiser**.","attendu":"Le bouton tourne quelques secondes, puis une notification verte « N serveurs trouvés, dont 0 nouveau(x). » (N proche de 63). La liste n'a pas changé."},{"id":"3.4","action":"Cliquer **Ajouter un dossier serveur**.","attendu":"Une fenêtre s'ouvre avec le champ « Chemin absolu sur la machine » (exemple grisé : `E:\\Minecraft\\Server\\MonServeur …`), un champ « Nom » et le bouton **Ajouter**."},{"id":"3.5","action":"Sans rien saisir, cliquer **Ajouter**.","attendu":"Le champ du chemin passe en rouge, la fenêtre reste ouverte, aucun serveur n'est ajouté. Fermer la fenêtre."}]},{"titre":"4. Créer, démarrer, savoir quand on peut rejoindre","contexte":"On crée ici le serveur de test, sur un port inhabituel pour voir la pastille.","etapes":[{"id":"4.1","action":"**Créer un serveur** → **Vanilla**, version proposée par défaut, nom de dossier `test-1013`, **Port de jeu** `25570`, cocher la case de l'EULA, puis **Créer le serveur**.","attendu":"En une à deux minutes, la page du serveur `test-1013` s'ouvre sur l'onglet **Aperçu**, serveur arrêté, bouton **Démarrer** visible."},{"id":"4.2","action":"Revenir sur **Serveurs** et regarder la carte `test-1013`.","attendu":"Elle porte une pastille « Port 25570 (à taper dans l'adresse) », lisible en thème sombre."},{"id":"4.3","action":"Sur la même page, regarder la carte d'un serveur resté sur le port 25565.","attendu":"Pas de pastille : seulement le texte gris « Port de jeu : 25565 »."},{"id":"4.4","action":"Sur la carte `test-1013`, cliquer **Démarrer**.","attendu":"Sous le nom, une ligne « Démarrage depuis 5 s : on ne peut pas encore rejoindre. » dont le compteur avance chaque seconde."},{"id":"4.5","action":"Attendre sans toucher (un premier lancement Vanilla prend une à trois minutes).","attendu":"La ligne devient verte : « Prêt : on peut rejoindre le serveur à l'adresse … », et l'adresse se termine par `:25570`."},{"id":"4.6","action":"Ouvrir la page de `test-1013` (cliquer son nom).","attendu":"La même ligne verte « Prêt : on peut rejoindre le serveur à l'adresse … » figure en haut de la page."},{"id":"4.7","action":"Dans Minecraft (même version), **Multijoueur** → **Connexion directe**, saisir l'adresse affichée, port compris.","attendu":"On entre dans le monde.","optionnel":true},{"id":"4.8","action":"Cliquer **Arrêter** et attendre l'arrêt.","attendu":"Le serveur repasse à l'arrêt et la ligne « Prêt… » a disparu."}]},{"titre":"5. Un démarrage refusé propose son remède","contexte":"Sur `test-1013` uniquement, serveur arrêté. On retire l'acceptation de l'EULA pour provoquer le refus.","etapes":[{"id":"5.1","action":"Page de `test-1013` → menu **Plus** → **Fichiers**. Ouvrir `eula.txt`, remplacer `eula=true` par `eula=false`, enregistrer.","attendu":"Le fichier est enregistré sans erreur ; en le rouvrant on lit `eula=false`."},{"id":"5.2","action":"Cliquer **Démarrer**.","attendu":"Le serveur ne démarre pas, et une fenêtre « EULA Minecraft » s'ouvre avec une case « J'ai lu et j'accepte l'EULA de Minecraft » et le bouton **Accepter et continuer** — pas seulement un message rouge."},{"id":"5.3","action":"Cocher la case, puis cliquer **Accepter et continuer**.","attendu":"La fenêtre se ferme et le serveur démarre **tout seul**, sans recliquer Démarrer (« Démarrage depuis … »). L'arrêter ensuite."},{"id":"5.4","action":"Refaire 5.1, cliquer **Démarrer**, puis fermer la fenêtre de l'EULA par sa croix, sans accepter.","attendu":"Le serveur reste à l'arrêt ; rien n'a été accepté (`eula.txt` contient toujours `eula=false`)."}]},{"titre":"6. Si ça se présente","contexte":"Ces refus sont difficiles à provoquer sans risque : ne les forcez pas. Si l'un d'eux arrive pendant votre usage normal, notez ici ce que vous avez vu.","etapes":[{"id":"6.1","action":"Un démarrage refusé parce que **le port est déjà pris** par un autre serveur en marche.","attendu":"Fenêtre « *nom* n'a pas démarré », avec « Le port N est déjà utilisé. » et le bouton **Ouvrir les réglages du serveur**, qui mène à l'onglet **Réglages** de ce serveur.","optionnel":true},{"id":"6.2","action":"Un démarrage refusé parce que **la mémoire manque**.","attendu":"Fenêtre « *nom* n'a pas démarré », avec « Mémoire insuffisante : … Mo nécessaires, … Mo disponibles. » et le bouton **Ouvrir les réglages du serveur**.","optionnel":true},{"id":"6.3","action":"Un démarrage refusé parce que **Java manque** sur la machine.","attendu":"Fenêtre « Java N manque sur la machine » avec le bouton **Installer Java N** ; après le clic, notification « Installation de Java N lancée. Relancez le serveur dès qu'elle est terminée… ».","optionnel":true},{"id":"6.4","action":"L'agent est arrêté (machine hors ligne) : regarder **Créer un serveur** et **Actualiser** sur la page Serveurs.","attendu":"Les deux boutons sont toujours là, grisés ; au survol : « Aucune machine n'est connectée : l'agent doit tourner sur la machine pour agir dessus. »","optionnel":true}]},{"titre":"7. Nettoyage","contexte":"« Oublier » ne supprime rien sur le disque : le dossier se retire à la main.","etapes":[{"id":"7.1","action":"Vérifier que `test-1013` est arrêté, puis sur sa page ouvrir le menu **Plus** → **Réglages**, cliquer **Oublier ce serveur** (en bas, en rouge) et confirmer. Faire de même pour `test-1013-pack` s'il a été créé.","attendu":"La confirmation dit « Le panel cesse de le gérer ; rien n'est supprimé sur le disque. » ; ensuite le serveur n'est plus dans la page **Serveurs**."},{"id":"7.2","action":"Dans l'Explorateur, supprimer les dossiers `test-1013` (et `test-1013-pack`) du répertoire surveillé, puis cliquer **Actualiser** sur la page Serveurs.","attendu":"Notification « N serveurs trouvés, dont 0 nouveau(x). » ; `test-1013` ne revient pas dans la liste."}]}]}</script>

<script>
(() => {
  const DATA = JSON.parse(document.getElementById('fiche-data').textContent);
  // Les textes de l'INTERFACE (boutons, bilan). Les étapes, elles, restent dans la langue où elles
  // ont été écrites : changer de langue ne les traduit pas.
  const LANGS = {
    fr: { ok: 'OK', ko: 'KO', skip: 'Passé', note: 'Note', expect: 'Attendu', copy: 'Copier le bilan', next: 'Étape suivante',
          notePh: 'Ce que vous avez vu, l’écart, l’heure…', done: 'faites', remaining: 'restantes', optional: 'optionnel',
          optBand: 'Optionnel — peut être sauté', optShort: 'opt.', hideOpt: 'Masquer les optionnelles', showOpt: 'Afficher les optionnelles',
          current: 'En cours', currentBand: '▶ Étape en cours', other: 'English', otherTitle: 'Switch the interface to English',
          report: 'Bilan', copied: 'Bilan copié — collez-le tel quel dans la conversation', close: 'Fermer', reset: 'Tout remettre à zéro',
          reportHint: 'Ce texte se colle tel quel dans la conversation avec l’assistant : rien à reformuler.',
          resetAsk: 'Effacer toutes les coches et toutes les notes de cette fiche ?', env: ['Quoi', 'Où'],
          failed: 'KO', skipped: 'Passées', notes: 'Notes sur des étapes OK', todo: 'Pas encore faites', todoOpt: 'Optionnelles pas faites', none: 'aucune',
          allDone: 'Toutes les étapes sont tranchées.', copyCode: 'Copier', copiedCode: 'Copié', noteLabel: 'Note', at: 'à' },
    en: { ok: 'Pass', ko: 'Fail', skip: 'Skip', note: 'Note', expect: 'Expected', copy: 'Copy the report', next: 'Next step',
          notePh: 'What you saw, the gap, the time…', done: 'done', remaining: 'left', optional: 'optional',
          optBand: 'Optional — can be skipped', optShort: 'opt.', hideOpt: 'Hide optional steps', showOpt: 'Show optional steps',
          current: 'Current', currentBand: '▶ Current step', other: 'Français', otherTitle: 'Passer l’interface en français',
          report: 'Report', copied: 'Report copied — paste it as is into the conversation', close: 'Close', reset: 'Reset everything',
          reportHint: 'Paste this text as is into the conversation with the assistant: nothing to rephrase.',
          resetAsk: 'Erase every mark and every note of this sheet?', env: ['What', 'Where'],
          failed: 'Failed', skipped: 'Skipped', notes: 'Notes on passed steps', todo: 'Not done yet', todoOpt: 'Optional steps not done', none: 'none',
          allDone: 'Every step has a verdict.', copyCode: 'Copy', copiedCode: 'Copied', noteLabel: 'Note', at: 'at' },
  };

  // --- Ce qui est gardé dans ce navigateur : verdicts et notes, étape en cours, préférences.
  const KEY = 'fiche-de-test:' + (DATA.cle || DATA.titre || 'fiche');
  const get = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const put = (k, v) => { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch { /* navigation privée */ } };
  let state = {};
  try { state = JSON.parse(get(KEY) || '{}') || {}; } catch { state = {}; }
  const save = () => { put(KEY, JSON.stringify(state)); };
  const steps = DATA.sections.flatMap((s, i) => s.etapes.map((e) => ({ ...e, sec: 's' + i })));
  // Une étape dont la révision a changé (corrigée ou réécrite) perd son verdict : elle est à rejouer.
  for (const e of steps) {
    const st = state[e.id];
    if (st && (st.rev || 0) !== (e.revision || 0)) state[e.id] = { note: st.note || '', rev: e.revision || 0 };
  }
  const hasOpt = steps.some((e) => e.optionnel);
  let lang = get('fiche-de-test:lang') || (DATA.langue === 'en' ? 'en' : 'fr');
  if (!LANGS[lang]) lang = 'fr';
  let hideOpt = get(KEY + ':hide-opt') === '1';
  let current = get(KEY + ':current');
  let L = LANGS[lang];

  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  // Mise en forme minimale : `code`, **gras**, *italique*. Rien d'autre n'est interprété.
  const rich = (t) => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html !== undefined) n.innerHTML = html; return n; };
  const $ = (id) => document.getElementById(id);
  const main = $('main');
  const side = $('side');
  const modal = $('modal');
  const items = new Map();
  const visible = (e) => !(hideOpt && e.optionnel);
  const untouched = (e) => !state[e.id]?.status && visible(e);

  // Première étape non tranchée APRÈS `fromId` (en reprenant du début s'il le faut).
  function nextUntouched(fromId) {
    const i = steps.findIndex((e) => e.id === fromId);
    return [...steps.slice(i + 1), ...steps.slice(0, i + 1)].find(untouched)?.id ?? null;
  }

  function render() {
    L = LANGS[lang];
    document.documentElement.lang = lang;
    document.title = DATA.titre;
    $('brand').textContent = DATA.titre;
    $('sub').textContent = DATA.sousTitre || '';
    $('copy').textContent = L.copy;
    $('next').textContent = L.next;
    $('lang').textContent = L.other; $('lang').title = L.otherTitle;
    $('modal-close').textContent = L.close;
    $('modal-reset').textContent = L.reset;
    $('modal-hint').textContent = L.reportHint;
    main.replaceChildren(); side.replaceChildren(); items.clear();

    main.append(el('h1', '', esc(DATA.titre)));
    for (const p of DATA.intro || []) main.append(el('p', '', rich(p)));
    if (DATA.regle) main.append(el('div', 'rule', rich(DATA.regle)));
    if ((DATA.environnement || []).length > 0) {
      const rows = DATA.environnement.map((r) => `<tr><td>${rich(r.quoi)}</td><td>${rich(r.ou)}</td></tr>`).join('');
      main.append(el('div', 'tablewrap', `<table><thead><tr><th>${L.env[0]}</th><th>${L.env[1]}</th></tr></thead><tbody>${rows}</tbody></table>`));
    }

    DATA.sections.forEach((s, i) => {
      const sid = 's' + i;
      const link = el('a', '', `<span>${rich(s.titre)}</span><span class="mini"></span>`);
      link.href = '#' + sid; link.dataset.sec = sid; side.append(link);
      const h2 = el('h2', '', `${rich(s.titre)}<span class="mini" data-sec="${sid}"></span>`); h2.id = sid; main.append(h2);
      if (s.contexte) main.append(el('p', '', rich(s.contexte)));
      const ol = el('ol', 'items'); main.append(ol);
      for (const raw of s.etapes) {
        const e = steps.find((x) => x.id === raw.id);
        const li = el('li', 'item'); li.id = 'e-' + e.id;
        const flag = el('span', 'cur-flag', L.currentBand);
        const band = e.optionnel ? el('span', 'opt-band', L.optBand) : null;
        const body = el('div', 'body',
          `<p><span class="id">${esc(e.id)}</span>${e.marque ? `<span class="tag">${esc(e.marque)}</span>` : ''}${rich(e.action)}</p>` +
          (e.code ? `<pre><code>${esc(e.code)}</code></pre>` : '') +
          `<p class="expect"><b>${L.expect}</b>${rich(e.attendu)}</p>`);
        if (e.code) {
          const cb = el('button', 'copy-code', L.copyCode); cb.type = 'button';
          cb.addEventListener('click', async () => {
            try { await navigator.clipboard.writeText(e.code); cb.textContent = L.copiedCode; setTimeout(() => { cb.textContent = L.copyCode; }, 1500); } catch { /* sélection à la main */ }
          });
          body.querySelector('pre').append(cb);
        }
        const ctl = el('div', 'ctl'); ctl.setAttribute('role', 'group'); ctl.setAttribute('aria-label', e.id);
        for (const s2 of ['ok', 'ko', 'skip']) {
          const b = el('button', '', L[s2]); b.type = 'button'; b.dataset.s = s2;
          b.addEventListener('click', () => { setStatus(e, s2); });
          ctl.append(b);
        }
        const nb = el('button', 'note-btn', L.note); nb.type = 'button';
        const ta = el('textarea', 'note'); ta.placeholder = L.notePh; ta.setAttribute('aria-label', L.note + ' ' + e.id); ta.hidden = true;
        nb.addEventListener('click', () => { ta.hidden = !ta.hidden; if (!ta.hidden) ta.focus(); });
        ta.addEventListener('input', () => { cell(e).note = ta.value; save(); paint(e); });
        // Cliquer une étape (hors boutons et note) en fait l'étape en cours.
        li.addEventListener('click', (ev) => { if (!ev.target.closest('button, textarea, a')) setCurrent(e.id, false); });
        ctl.append(nb); li.append(flag, ...(band ? [band] : []), body, ctl, ta); ol.append(li);
        items.set(e.id, { li, ctl, ta, nb });
      }
    });
    for (const e of steps) paint(e);
    applyOpt(); totals();
  }

  function cell(e) { return (state[e.id] ||= { rev: e.revision || 0, note: '' }); }
  function setCurrent(id, scroll) {
    current = id && items.has(id) ? id : null;
    put(KEY + ':current', current);
    for (const [k, it] of items) {
      it.li.classList.toggle('current', k === current);
      if (k === current) it.li.setAttribute('aria-current', 'step'); else it.li.removeAttribute('aria-current');
    }
    const e = steps.find((x) => x.id === current);
    for (const a of side.querySelectorAll('a')) a.classList.toggle('here', !!e && a.dataset.sec === e.sec);
    $('cur').textContent = current ? `${L.current}${lang === 'fr' ? ' : ' : ': '}${current}` : L.allDone;
    if (scroll && current) items.get(current).li.scrollIntoView({ block: 'center' });
  }
  function setStatus(e, s) {
    const c = cell(e);
    c.status = c.status === s ? undefined : s; // re-cliquer annule
    c.at = c.status ? new Date().toISOString() : undefined;
    save(); paint(e); totals();
    const it = items.get(e.id);
    // Un KO sans explication ne sert à rien à celui qui corrige : on reste dessus et on ouvre la note.
    if (c.status === 'ko') { setCurrent(e.id, false); it.ta.hidden = false; it.ta.focus(); return; }
    // OK ou Passé : l'étape en cours devient la suivante à faire.
    if (c.status) setCurrent(nextUntouched(e.id), true);
  }
  function paint(e) {
    const it = items.get(e.id); const c = state[e.id] || {};
    it.li.className = 'item' + (e.optionnel ? ' opt' : '') + (c.status ? ' s-' + c.status : '') + (e.id === current ? ' current' : '');
    it.li.dataset.status = c.status || '';
    for (const b of it.ctl.querySelectorAll('button[data-s]')) {
      const on = b.dataset.s === c.status; b.className = on ? 'on-' + b.dataset.s : ''; b.setAttribute('aria-pressed', String(on));
    }
    if (it.ta.value !== (c.note || '')) it.ta.value = c.note || '';
    if (c.note) it.ta.hidden = false;
    it.nb.className = 'note-btn' + (c.note ? ' has-note' : '');
  }
  function applyOpt() {
    document.body.classList.toggle('hide-opt', hideOpt);
    const n = steps.filter((e) => e.optionnel).length;
    $('opt-toggle').hidden = !hasOpt;
    $('opt-toggle').textContent = `${hideOpt ? L.showOpt : L.hideOpt} (${n})`;
    $('opt-toggle').setAttribute('aria-pressed', String(hideOpt));
  }
  function totals() {
    const n = { ok: 0, ko: 0, skip: 0 };
    for (const e of steps) { const s = state[e.id]?.status; if (s) n[s]++; }
    const total = steps.length || 1;
    for (const k of ['ok', 'ko', 'skip']) $('b-' + k).style.width = (100 * n[k] / total) + '%';
    // Les étapes optionnelles sont comptées à part : ne pas les faire n'empêche pas d'avoir fini.
    const req = steps.filter((e) => !e.optionnel); const opt = steps.filter((e) => e.optionnel);
    const d = (list) => list.filter((e) => state[e.id]?.status).length;
    $('count').textContent = `${d(req)}/${req.length} ${L.done}` + (opt.length ? ` · ${L.optShort} ${d(opt)}/${opt.length}` : '') + ` · ${n.ko} ${L.ko}`;
    DATA.sections.forEach((s, i) => {
      const sid = 's' + i; const st = s.etapes.map((e) => state[e.id]?.status);
      const dn = st.filter(Boolean).length; const txt = `${dn}/${s.etapes.length}`;
      for (const m of document.querySelectorAll(`.mini[data-sec="${sid}"], a[data-sec="${sid}"] .mini`)) m.textContent = txt;
      const a = side.querySelector(`a[data-sec="${sid}"]`);
      a.classList.toggle('has-ko', st.includes('ko'));
      a.classList.toggle('done', dn === s.etapes.length && s.etapes.length > 0);
    });
  }

  function report() {
    const hour = (iso) => { try { return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch { return ''; } };
    const line = (e) => `- ${e.id}${e.optionnel ? ` (${L.optional})` : ''} — ${e.action.replace(/\s+/g, ' ').slice(0, 140)}` +
      (state[e.id]?.at ? ` [${L.at} ${hour(state[e.id].at)}]` : '') +
      (state[e.id]?.note ? `\n    ${L.noteLabel} : ${state[e.id].note.replace(/\n/g, '\n    ')}` : '');
    const by = (s) => steps.filter((e) => state[e.id]?.status === s);
    const block = (title, list) => `\n## ${title} (${list.length})\n` + (list.length ? list.map(line).join('\n') : `- ${L.none}`);
    const ids = (title, list) => `\n\n## ${title} (${list.length})\n` + (list.length ? list.map((e) => e.id).join(', ') : `- ${L.none}`);
    const ok = by('ok'); const ko = by('ko'); const skip = by('skip');
    const todo = steps.filter((e) => !state[e.id]?.status);
    return `# ${L.report} — ${DATA.titre}\n${DATA.sousTitre ? DATA.sousTitre + '\n' : ''}${new Date().toLocaleString()}\n` +
      `${ok.length} ${L.ok} · ${ko.length} ${L.ko} · ${skip.length} ${L.skip} · ${todo.length} ${L.remaining} / ${steps.length}\n` +
      block(L.failed, ko) + '\n' + block(L.skipped, skip) + '\n' + block(L.notes, ok.filter((e) => state[e.id]?.note)) +
      ids(L.todo, todo.filter((e) => !e.optionnel)) + (hasOpt ? ids(L.todoOpt, todo.filter((e) => e.optionnel)) : '') + '\n';
  }

  $('copy').addEventListener('click', async () => {
    const text = report();
    let copied = false;
    try { await navigator.clipboard.writeText(text); copied = true; } catch { /* page locale ou http : on montre le texte */ }
    $('modal-title').textContent = copied ? L.copied : L.report;
    const ta = $('modal-text'); ta.value = text; modal.hidden = false; ta.focus(); ta.select();
  });
  $('modal-close').addEventListener('click', () => { modal.hidden = true; });
  $('modal-reset').addEventListener('click', () => {
    if (!confirm(L.resetAsk)) return;
    state = {}; save(); for (const e of steps) paint(e); totals(); modal.hidden = true; setCurrent(nextUntouched(null), true);
  });
  $('next').addEventListener('click', () => {
    const id = nextUntouched(current);
    if (!id) { alert(L.allDone); return; }
    setCurrent(id, true);
  });
  $('cur').addEventListener('click', () => { setCurrent(current || nextUntouched(null), true); });
  $('lang').addEventListener('click', () => {
    lang = lang === 'fr' ? 'en' : 'fr'; put('fiche-de-test:lang', lang);
    render(); setCurrent(current, false);
  });
  $('opt-toggle').addEventListener('click', () => {
    hideOpt = !hideOpt; put(KEY + ':hide-opt', hideOpt ? '1' : null); applyOpt();
    const e = steps.find((x) => x.id === current);
    if (e && !visible(e)) setCurrent(nextUntouched(current), false);
  });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') modal.hidden = true; });

  save(); render();
  const cur = steps.find((x) => x.id === current);
  setCurrent(cur && untouched(cur) ? current : nextUntouched(null), false);
})();
</script>
</body>
</html>
