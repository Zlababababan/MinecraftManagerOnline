packages:
  - apps/*
  - packages/*

# Hygiène chaîne d'approvisionnement (pnpm ≥ 10/11) :
# - scripts postinstall bloqués par défaut → liste blanche explicite ;
# - aucune version publiée depuis moins de 3 jours n'est installée (fenêtre de détection des compromissions).
allowBuilds:
  esbuild: true
  better-sqlite3: true

minimumReleaseAge: 4320

# Versions exactes (pnpm 11 lit ses réglages ici ; `.npmrc` conservé pour les outils tiers).
saveExact: true
